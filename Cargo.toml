[package]
name = "unlatch"
version = "0.1.0"
edition = "2024"
description = "Right-click any file or folder to see which processes are locking it, and unlock it."
license = "MIT"
repository = "https://github.com/AdriaanBoshoff/Unlatch"
build = "build.rs"

[workspace]
members = [".", "shellext"]

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"] }
rfd = "0.18.0"

[dependencies.windows-sys]
version = "0.61.2"
features = [
    "Wdk_System_SystemInformation",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_System_RestartManager",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
